// Google Play's in-app updates for the game (AppUpdate): whether the store has a newer build, and its full-screen
// "update now" flow
apply plugin: 'com.android.library'

android {
    namespace 'com.flickcurling.update'
    compileSdk 35
    defaultConfig { minSdk 23 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.play:app-update:2.1.0'
}
