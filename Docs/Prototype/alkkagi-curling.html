<title>알까기 컬링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen game table. Scoreboard strip on top, the sheet fills the middle, turn bar at the bottom; the dev panel slides over from the right. */
:root{
  color-scheme: dark;
  --table:#20160f;
  --panel:#2c2017;
  --panel-2:#3a2b20;
  --line:rgba(239,226,200,.14);
  --text:#efe2c8;
  --muted:#b39f84;
  --brass:#d9a54c;
  --brass-ink:#2a1b0c;
  --ink-soft:#9fb2e0;
  --ok:#9cc787;
  --warn:#e6a85e;
  --font-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--table);color:var(--text);font-family:var(--font-body);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible+label,input[type=range]:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.app{height:100%}

/* HUD floats over the field; containers let gestures through, only the panels catch taps */
.glass{background:rgba(30,20,13,.8);border:1px solid var(--line);border-radius:10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.hud-top{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-direction:row;flex-wrap:wrap;align-items:stretch;gap:6px;pointer-events:none;z-index:2}
.hud-top > *{pointer-events:auto}
.score-pill{display:flex;align-items:center;gap:5px;padding:5px 9px;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.score-pill b{font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--brass);line-height:1}
.score-pill .end{color:var(--muted);font-size:12px;margin-left:4px}
.score-pill .chev{color:var(--muted);font-size:9px}
.score-pill .dot{margin-right:0}
.score-pill .hm{margin-left:2px}
.score-panel{position:absolute;top:42px;left:0;padding:8px 6px;z-index:3}
.score{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
.score th,.score td{padding:3px 7px;text-align:center;border-left:1px solid var(--line)}
.score thead th{color:var(--muted);font-weight:400;font-size:11px;letter-spacing:.06em}
.score tbody th{text-align:left;font-weight:400;border-left:0;white-space:nowrap}
.score td.cur,.score th.cur{background:var(--panel-2)}
.score td.total{font-family:var(--font-display);font-size:17px;color:var(--brass)}
.hm{display:inline-block;margin-left:5px;padding:0 5px;border-radius:3px;background:var(--brass);color:var(--brass-ink);font-size:10px;line-height:16px;vertical-align:1px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:inset -1px -2px 2px rgba(0,0,0,.35)}
.dot.B{background:radial-gradient(circle at 35% 30%,#666,#111 60%)}
.dot.W{background:radial-gradient(circle at 35% 30%,#fff,#d8d2c4 70%)}

/* stage */
.stage{position:relative;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.toast{position:absolute;z-index:4;left:50%;top:34%;transform:translateX(-50%);width:max-content;max-width:min(420px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:none;text-align:center}
.toast.low{top:54%}
.toast b{display:block;font-family:var(--font-display);font-size:17px;font-weight:400;color:var(--brass);margin-bottom:2px}
.toast span{color:var(--text);font-size:13px}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;background:rgba(20,13,8,.62)}
.overlay.soft{align-items:flex-end;background:linear-gradient(to top,rgba(20,13,8,.75),rgba(20,13,8,0) 55%)}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 18px 48px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px}
.eyebrow{margin:0;color:var(--muted);font-size:11px;letter-spacing:.14em}
.card h1,.card h2{margin:0;font-family:var(--font-display);font-weight:400;line-height:1.05;text-wrap:balance}
.card h1{font-size:44px}
.card h2{font-size:26px}
.headline{margin:0;font-family:var(--font-display);font-size:34px;color:var(--brass);line-height:1.1}
.card p{margin:0;line-height:1.55}
.lede{color:var(--text)}
.muted{color:var(--muted)}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
legend{padding:0;margin-bottom:6px;color:var(--muted);font-size:11px;letter-spacing:.12em}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills label{padding:7px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--panel-2);font-size:13px}
.pills input:checked+label{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-family:var(--font-display);font-size:18px;padding:9px 20px}
.btn:hover{filter:brightness(1.08)}

/* turn card + corner controls */
.turn{padding:4px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0}
.turn-main{font-size:12px;color:var(--muted);white-space:nowrap}
.turn-main b{font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--text);margin-right:6px}
.turn-sub{color:var(--muted);font-size:11px;display:flex;gap:0 8px;flex-wrap:wrap;white-space:nowrap}
.pips{letter-spacing:0;font-size:10px}
.tag{color:var(--ink-soft)}
.tag.gold{color:var(--brass)}
.hud-br{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:2}
.hud-br > .btn + .btn{margin-top:0}
.hud-br > .btn{padding:6px 12px;background:rgba(44,32,23,.92);font-size:14px;line-height:1.2}
.more{display:flex;flex-direction:column;gap:2px;padding:6px}
.lv-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lv-name{width:2.6em;font-size:13px}
.lv-name .dot{margin-right:4px}
.more .btn{text-align:left;background:transparent;border-color:transparent;padding:8px 12px;font-size:13px}
.more .btn:hover{background:var(--panel-2)}
.spin{display:flex;align-items:center;gap:4px;padding:4px}
.spin-label{color:var(--muted);font-size:11px;padding:0 4px 0 6px}
.spin .btn{padding:6px 9px;font-size:13px;background:transparent;border-color:transparent}
.spin .btn[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}

/* dev panel */
.dev{position:fixed;top:0;right:0;bottom:0;width:min(320px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.45);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;z-index:5}
.dev-head{display:flex;justify-content:space-between;align-items:center}
.dev h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px}
.dev h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:400}
.dev section{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--brass)}
.sl{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.sl label{font-size:13px}
.sl output{font-variant-numeric:tabular-nums;color:var(--brass)}
.sl input{grid-column:1 / -1;width:100%;accent-color:var(--brass)}
.reach{margin:0;font-size:12px;line-height:1.6;color:var(--muted);font-variant-numeric:tabular-nums}
.reach .ok{color:var(--ok)} .reach .warn{color:var(--warn)}
pre{margin:0;background:var(--table);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:11px;line-height:1.5;overflow-x:auto;white-space:pre}

@media (max-width:520px){
  .card h1{font-size:36px}
  .score th,.score td{padding:3px 5px}
}
</style>

<div class="app">
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="경기 판"></canvas>
    <div class="hud-top" id="hudTop">
      <button class="glass score-pill" id="scorePill" aria-expanded="false" aria-controls="scorePanel"></button>
      <div class="glass turn" id="turn"></div>
      <div class="glass score-panel" id="scorePanel" hidden><table class="score" id="score" aria-label="엔드별 점수"></table></div>
    </div>
    <div class="toast" id="toast" hidden><b id="toastT"></b><span id="toastB"></span></div>
    <div class="hud-br">
      <div class="glass more" id="more" hidden>
        <button class="btn" id="menuBtn">메뉴로 나가기</button>
        <button class="btn" id="soundBtn">소리 켬</button>
        <button class="btn" id="devBtn">개발자 패널</button>
      </div>
      <div class="glass spin" id="spinBar" role="group" aria-label="쿠션 회전" hidden>
        <span class="spin-label">회전</span>
        <button class="btn" id="spinShort" data-spin="-1" aria-pressed="false">짧게</button>
        <button class="btn" id="spinNone" data-spin="0" aria-pressed="true">기본</button>
        <button class="btn" id="spinLong" data-spin="1" aria-pressed="false">길게</button>
      </div>
      <button class="btn" id="speedBtn" hidden aria-label="관전 속도">1배속</button>
      <button class="btn" id="moreBtn" aria-expanded="false" aria-controls="more">설정</button>
    </div>

    <div class="overlay" id="menu">
      <div class="card">
        <p class="eyebrow">웹 프로토타입 · 룰과 손맛 검증용</p>
        <h1>알까기 컬링</h1>
        <p class="lede">바둑알을 튕겨 상대 알은 쳐내고 내 알만 중앙에 남기세요. 4엔드, 엔드당 10샷(1인당 알 5개)이며 중앙에 가장 가까운 쪽만 득점합니다.</p>
        <p class="muted">최소 라인을 넘지 못하거나 백 라인을 넘어간 알은 무효입니다. 측벽 쿠션은 허용됩니다.</p>
        <fieldset>
          <legend>모드</legend>
          <div class="pills">
            <input type="radio" name="mode" id="m-pvp" value="pvp" checked><label for="m-pvp">2인 대전</label>
            <input type="radio" name="mode" id="m-easy" value="easy"><label for="m-easy">AI 쉬움</label>
            <input type="radio" name="mode" id="m-normal" value="normal"><label for="m-normal">AI 보통</label>
            <input type="radio" name="mode" id="m-hard" value="hard"><label for="m-hard">AI 어려움</label>
            <input type="radio" name="mode" id="m-watch" value="watch"><label for="m-watch">AI 관전</label>
          </div>
        </fieldset>
        <fieldset id="watchLv" hidden>
          <legend>관전할 AI 난이도</legend>
          <div class="lv-row"><span class="lv-name"><span class="dot B"></span>흑</span>
            <div class="pills">
              <input type="radio" name="lvB" id="lvB-easy" value="easy"><label for="lvB-easy">쉬움</label>
              <input type="radio" name="lvB" id="lvB-normal" value="normal"><label for="lvB-normal">보통</label>
              <input type="radio" name="lvB" id="lvB-hard" value="hard" checked><label for="lvB-hard">어려움</label>
            </div></div>
          <div class="lv-row"><span class="lv-name"><span class="dot W"></span>백</span>
            <div class="pills">
              <input type="radio" name="lvW" id="lvW-easy" value="easy"><label for="lvW-easy">쉬움</label>
              <input type="radio" name="lvW" id="lvW-normal" value="normal"><label for="lvW-normal">보통</label>
              <input type="radio" name="lvW" id="lvW-hard" value="hard" checked><label for="lvW-hard">어려움</label>
            </div></div>
        </fieldset>
        <fieldset>
          <legend>맵</legend>
          <div class="pills">
            <input type="radio" name="map" id="p-base" value="base" checked><label for="p-base">기본</label>
            <input type="radio" name="map" id="p-bumper" value="bumper"><label for="p-bumper">범퍼</label>
            <input type="radio" name="map" id="p-zones" value="zones"><label for="p-zones">모래·빙판</label>
            <input type="radio" name="map" id="p-kink" value="kink"><label for="p-kink">꺾인 측벽</label>
            <input type="radio" name="map" id="p-random" value="random"><label for="p-random">랜덤</label>
          </div>
        </fieldset>
        <div class="actions"><button class="btn primary" id="startBtn">경기 시작</button></div>
      </div>
    </div>

    <div class="overlay" id="cardOv" hidden>
      <div class="card">
        <p class="eyebrow" id="cardEyebrow"></p>
        <h2 id="cardTitle"></h2>
        <p class="headline" id="cardHead"></p>
        <p id="cardBody"></p>
        <div class="actions" id="cardActions"></div>
      </div>
    </div>
  </main>

</div>

<aside class="dev" id="dev" hidden aria-label="개발자 패널">
  <div class="dev-head"><h2>개발자 패널</h2><button class="btn" id="devClose">닫기</button></div>
  <section>
    <h3>테스트 토글</h3>
    <label class="sw"><input type="checkbox" id="optAim"> 조준선 (첫 충돌 지점까지)</label>
    <label class="sw"><input type="checkbox" id="optFgz"> 프리 가드 존 (상대 가드 제거 금지)</label>
    <label class="sw"><input type="checkbox" id="optBan"> 보호 기간 쿠션 금지</label>
    <label class="sw"><input type="checkbox" id="optBlank"> 블랭크 엔드면 해머 이동 (믹스 더블 규칙)</label>
    <label class="sw"><input type="checkbox" id="optLsd"> 라스트 스톤 드로로 1엔드 해머 결정 (끄면 동전)</label>
    <label class="sw"><input type="checkbox" id="optPlaced"> 선공 보너스 가드 (해머 없는 쪽이 가드 1개를 깔고 시작)</label>
    <label class="sw"><input type="checkbox" id="optPlacedHouse"> └ 해머 쪽 하우스 알도 배치 (믹스 더블식, 비교용)</label>
    <div class="sl"><label for="slFgz">프리 가드 존 샷 수 (엔드 처음 N샷)</label><output id="oFgz"></output><input type="range" id="slFgz" min="1" max="6" step="1"></div>
    <label class="sw"><input type="checkbox" id="optGutter"> 열린 측벽 (가드 존 옆 벽 없음, 나가면 추락)</label>
    <label class="sw"><input type="checkbox" id="optLanes"> 발사 라인 선택 (좌·중·우, 알을 옆으로 끌어 변경)</label>
    <label class="sw"><input type="checkbox" id="optTicket"> 쿠션권 (측벽에 닿는 샷은 쿠션권 1장 사용)</label>
    <div class="sl"><label for="slTicket">쿠션권 수 (엔드당 1인)</label><output id="oTicket"></output><input type="range" id="slTicket" min="1" max="3" step="1"></div>
    <label class="sw"><input type="checkbox" id="optRails"> 쿠션 구간 (탄력 레일만 튕김)</label>
    <fieldset>
      <legend>탄력 레일 배치</legend>
      <div class="pills">
        <input type="radio" name="railLayout" id="rlLow" value="low"><label for="rlLow">아래 벽</label>
        <input type="radio" name="railLayout" id="rlTwo" value="two"><label for="rlTwo">두 구간 (이전)</label>
      </div>
    </fieldset>
    <div class="sl"><label for="slLive">아래 벽 탄력 레일 끝 (최소 라인 = 64)</label><output id="oLive"></output><input type="range" id="slLive" min="64" max="130" step="2"></div>
    <label class="sw"><input type="checkbox" id="optSpin"> 회전 (쿠션 짧게 / 길게)</label>
  </section>
  <section>
    <h3>물리 수치</h3>
    <div class="sl"><label for="slDecel">마찰 (감속, 단위/s²)</label><output id="oDecel"></output><input type="range" id="slDecel" min="20" max="150" step="1"></div>
    <div class="sl"><label for="slStone">알끼리 반발 계수</label><output id="oStone"></output><input type="range" id="slStone" min="0.5" max="1" step="0.01"></div>
    <div class="sl"><label for="slWall">측벽 반발 계수</label><output id="oWall"></output><input type="range" id="slWall" min="0.3" max="1" step="0.01"></div>
    <fieldset class="seg-field">
      <legend>반사 방식</legend>
      <div class="pills">
        <input type="radio" name="bounce" id="bPhys" value="phys"><label for="bPhys">물리</label>
        <input type="radio" name="bounce" id="bMirror" value="mirror"><label for="bMirror">거울</label>
      </div>
      <p class="reach" id="bounceNote"></p>
    </fieldset>
    <div class="sl"><label for="slVmax">최대 세기 (초속, 단위/s)</label><output id="oVmax"></output><input type="range" id="slVmax" min="120" max="320" step="1"></div>
    <p class="reach" id="reach"></p>
    <div class="actions"><button class="btn" id="devReset">기본값으로</button></div>
  </section>
  <section>
    <h3>Unity 이식용 값</h3>
    <pre id="devJson"></pre>
    <div class="actions"><button class="btn" id="devCopy">값 복사</button></div>
  </section>
</aside>

<script>
(() => {
'use strict';

/* ================= constants (world units: sheet width = 100) ================= */
const W = 100, L = 222, HOG = 64, BACK = 200, R = 28, SR = 4, MAXDRAG = 36, DT = 1 / 180;
const TEE = { x: 50, y: 172 }, LAUNCH = { x: 50, y: 14 };
// launch lanes: the shooter picks left / centre / right on the start line. LAUNCH.x is moved to the chosen lane
// for each shot (the AI moves it temporarily while it searches). +-15 keeps the bonus guard across the straight line to the button.
const LANES = [35, 50, 65];
const launchXs = () => (opts.lanes ? LANES : [LAUNCH.x]);
const nearestLane = x => LANES.reduce((a, b) => (Math.abs(b - x) < Math.abs(a - x) ? b : a));
const SHOTS = 10, PER = SHOTS / 2, ENDS = 4;
const DEFAULTS = { decel: 60, eStone: 0.9, eWall: 0.75, vmax: 197 };
const TEAM = { B: '흑', W: '백' };
const other = t => (t === 'B' ? 'W' : 'B');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

const P = { ...DEFAULTS };
const opts = { aim: true, fgz: false, placed: true, placedHouse: false, fgzShots: 4, sound: true, gutter: false, ticket: true, ticketCount: 2, lanes: true, rails: true, railLayout: 'low', liveTop: 80, cushionBan: false, spin: false, mirror: false, blankSwitch: true, lsd: true };
try {
  const saved = JSON.parse(localStorage.getItem('alkkagi-curling-dev-v7') || 'null');
  if (saved) { Object.assign(P, saved.P || {}); Object.assign(opts, saved.opts || {}); }
} catch (e) {}
function saveDev() { try { localStorage.setItem('alkkagi-curling-dev-v7', JSON.stringify({ P, opts })); } catch (e) {} }
// free guard zone: protects guards from removal AND bans cushions for its first opts.fgzShots shots of the end
const fgzActive = () => opts.fgz && G.shot < opts.fgzShots && G.shot < SHOTS;
const cushionBanned = () => !!opts.cushionBan && fgzActive();

/* ================= maps ================= */
const seg = (x1, y1, x2, y2) => ({ x1, y1, x2, y2 });
const poly = pts => pts.slice(1).map((p, i) => seg(pts[i][0], pts[i][1], p[0], p[1]));
const TOPY = L + 60;
const BASE_WALLS = [seg(0, 0, 0, TOPY), seg(W, 0, W, TOPY), seg(0, 0, W, 0)];
const LEFT_KINK = [[0, 0], [0, 84], [11, 100], [11, 116], [0, 132], [0, TOPY]];
const RIGHT_KINK = LEFT_KINK.map(([x, y]) => [W - x, y]);
const MAPS = {
  base: { name: '기본', walls: BASE_WALLS, posts: [], zones: [], kinks: [] },

/* ================= physics (deterministic, fixed step) ================= */
function hitSeg(s, g, ev) {
  const dx = g.x2 - g.x1, dy = g.y2 - g.y1;

  const vn = s.vx * nx + s.vy * ny;
  if (vn < 0) {
    const e = g.dead ? DEAD_E : P.eWall;
    if (opts.mirror && !g.dead) {
      // mirror mode: angle out = angle in; restitution only takes speed off (dead rails stay physical)
      s.vx -= 2 * vn * nx; s.vy -= 2 * vn * ny;
      s.vx *= e; s.vy *= e;
    } else {
      // physical: only the part heading into the wall loses energy, so the rebound lies flatter
      s.vx -= (1 + e) * vn * nx; s.vy -= (1 + e) * vn * ny;
    }
    // dead rail eats the slide along the wall; spin (lively rail only) stretches or shortens it
    if (!isBottomWall(g)) {
      const k = g.dead ? DEAD_SLIDE : 1 + (s.spin || 0) * SPIN_K;
      if (k !== 1) { const tx = -ny, ty = nx, vt = s.vx * tx + s.vy * ty; s.vx += (k - 1) * vt * tx; s.vy += (k - 1) * vt * ty; }

}
function hitPost(s, p, ev) {

}

function step(stones, map, ev) {

    if (!s.live) continue;
    const sp = Math.hypot(s.vx, s.vy);
    if (sp === 0) continue;
    const ns = sp - P.decel * zoneMult(map, s.x, s.y) * DT;
    if (ns <= 0) { s.vx = 0; s.vy = 0; continue; }
    const f = ns / sp;
    s.vx *= f; s.vy *= f;
    s.x += s.vx * DT; s.y += s.vy * DT;
  }
  for (const s of stones) {
    if (!s.live) continue;
    for (const g of map.walls) hitSeg(s, g, ev);
    for (const p of map.posts) hitPost(s, p, ev);

  for (let i = 0; i < stones.length; i++) {

/* ================= rules ================= */
function inGuardZone(s) { return s.y - SR >= HOG && s.y < TEE.y && dist(s, TEE) > R + SR; }
// The min-line rule applies only to the stone just delivered (as in curling's hog-line rule);
// a stone already in play that gets knocked back short of the line stays in play.
function outReason(s, deliveredId) {
  if (s.fell) return 'fall';
  if (s.flew || s.y - SR > BACK) return 'back';

  const removed = [];
  for (const s of stones) {
    if (!s.live && !s.flew && !s.fell) continue;
    const why = outReason(s, deliveredId);
    if (why) removed.push({ s, why });
  }
  const ids = new Set(removed.map(r => r.s.id));
  const violation = protectedIds.some(id => ids.has(id));

}

  const list = stones.filter(s => s.live).map(s => ({ s, d: dist(s, TEE) }))
    .filter(o => o.d <= R + SR).sort((a, b) => a.d - b.d);
  if (!list.length) return { team: null, points: 0, list, ids: [] };
  const team = list[0].s.team;
  const opp = list.find(o => o.s.team !== team);
  if (opp && Math.abs(opp.d - list[0].d) < 1e-6) return { team: null, points: 0, list, ids: [], tie: true };
  const lim = opp ? opp.d : Infinity;
  const sc = list.filter(o => o.s.team === team && o.d < lim);
  return { team, points: sc.length, list, ids: sc.map(o => o.s.id) };
}

/* ================= sound (generated) ================= */
let ac = null, noiseBuf = null, lastSound = 0;
function audio() {
  if (!opts.sound) return null;
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.08), ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { return null; }

}

  const now = performance.now(); if (now - lastSound < 18) return; lastSound = now;
  const src = a.createBufferSource(); src.buffer = noiseBuf;
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
  const g = a.createGain(); const t = a.currentTime;
  g.gain.setValueAtTime(Math.min(1, vol) * 0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);

}

  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = 'triangle'; o.frequency.value = 660 * Math.pow(1.26, n - 1);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.4);
}
const liveEv = {
  hit(a, b, j) {
    blip(j / 70, 2600, 4, 0.05);
    if (a.id === G.shotId || b.id === G.shotId) G.shotHitStone = true;   // later wall touches are not cushions
  },
  post(s, vn) { blip(vn / 70, 1500, 5, 0.07); },
  wall(s, vn, g) {
    blip(vn / 90, 420, 2, 0.09);
    if (s.id !== G.shotId || G.state !== 'moving' || isBottomWall(g)) return;
    // cushion ticket: the first wall touch of the shot uses the ticket, or fouls without one
    // free guard zone: no cushions while it is active
    // only a direct cushion counts: the shot stone reaching a side wall before it has touched any stone
    const direct = !G.shotHitStone;
    if (direct && cushionBanned() && !G.foul) {
      G.foul = true; G.foulReason = 'fgz';
      G.floats.push({ x: s.x, y: s.y - 6, text: '쿠션 금지', t: 0 });
    }
    if (direct && opts.ticket && !G.wallTouched && !G.foul) {
      G.wallTouched = true;
      if (G.tickets[s.team] > 0) { G.tickets[s.team]--; G.floats.push({ x: s.x, y: s.y - 6, text: '쿠션권 사용', t: 0 }); renderTurn(); }
      else { G.foul = true; G.foulReason = 'ticket'; G.floats.push({ x: s.x, y: s.y - 6, text: '쿠션권 없음', t: 0 }); }
    }
    if (vn > 6) {

      G.cushions++;

    const noTicket = opts.ticket && !G.inLSD && G.state === 'aim' && G.tickets[G.cur] <= 0;
    if (hit.kind === 'wall' && (cushionBanned() || noTicket)) {
      ctx.strokeStyle = '#c0503a'; ctx.lineWidth = 2; circle(X(hit.x), Y(hit.y), SR * s); ctx.stroke();
      ctx.save(); ctx.font = '12px "Gowun Dodum", sans-serif'; ctx.textAlign = hit.x < W / 2 ? 'left' : 'right'; ctx.textBaseline = 'middle';
      const lx2 = X(hit.x) + (hit.x < W / 2 ? 1 : -1) * (SR * s + 6);
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(32,20,11,.85)'; ctx.strokeText(noTicket ? '쿠션권 없음' : '쿠션 금지', lx2, Y(hit.y));
      ctx.fillStyle = '#ff9c84'; ctx.fillText(noTicket ? '쿠션권 없음' : '쿠션 금지', lx2, Y(hit.y)); ctx.restore();
    } else if (hit.kind !== 'none') { ctx.strokeStyle = 'rgba(40,24,12,.55)'; ctx.lineWidth = 1.2; circle(X(hit.x), Y(hit.y), SR * s); ctx.stroke(); }
  }
  ctx.save();
  ctx.font = '15px "Do Hyeon", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tx = lx + dx * (r0 + len + 18), ty = ly + dy * (r0 + len + 18);
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(32,20,11,.75)'; ctx.strokeText(`${Math.round(pw * 100)}%`, tx, ty);
  ctx.fillStyle = '#ffe2a6'; ctx.fillText(`${Math.round(pw * 100)}%`, tx, ty);
  ctx.restore();
}
function draw(time) {
  const s = g.s;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#20160f'; ctx.fillRect(0, 0, g.cw, g.ch);
  if (!wood) return;
  drawBoard(time);

  const playing = ['aim', 'ai', 'ai-pull', 'moving', 'settle'].includes(G.state);
  // live scoring glow
  if (playing || G.state === 'menu') {
    const sc = scoring(G.stones);
    for (const id of sc.ids) {
      const st = G.stones.find(x => x.id === id);
      ctx.strokeStyle = 'rgba(255,214,120,.55)'; ctx.lineWidth = 3;
      circle(X(st.x), Y(st.y), (SR + 1.4) * s); ctx.stroke();
    }
  }
  // protected stones
  if (playing && G.protectedIds.length && G.state !== 'settle') {
    ctx.save(); ctx.setLineDash([3, 3]); ctx.strokeStyle = 'rgba(28,44,92,.9)'; ctx.lineWidth = 2;
    for (const id of G.protectedIds) { const st = G.stones.find(x => x.id === id); if (st && st.live) { circle(X(st.x), Y(st.y), (SR + 1.6) * s); ctx.stroke(); } }
    ctx.restore();
  }
  // fades
  if (G.inLSD && G.lsd) {
    // the draw target: a ring with a cross, drawn under the stones
    const T = G.lsd.target, tx = X(T.x), ty = Y(T.y), rr = Math.max(7, SR * g.s * 0.9);
    const pulse = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.5 : (Math.sin(time / 260) + 1) / 2;
    ctx.save();
    ctx.strokeStyle = 'rgba(32,20,11,.75)'; ctx.lineWidth = 5; circle(tx, ty, rr); ctx.stroke();
    ctx.strokeStyle = `rgba(255,217,138,${0.75 + 0.25 * pulse})`; ctx.lineWidth = 2.5; circle(tx, ty, rr); ctx.stroke();
    ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(tx - rr * 1.6, ty); ctx.lineTo(tx - rr * 0.5, ty); ctx.moveTo(tx + rr * 0.5, ty); ctx.lineTo(tx + rr * 1.6, ty);
    ctx.moveTo(tx, ty - rr * 1.6); ctx.lineTo(tx, ty - rr * 0.5); ctx.moveTo(tx, ty + rr * 0.5); ctx.lineTo(tx, ty + rr * 1.6);
    ctx.stroke();
    ctx.fillStyle = '#ffd98a'; circle(tx, ty, 2); ctx.fill();
    ctx.restore();
  }
  for (const f of G.fades) drawStone(f.x, f.y, f.team, f.a, f.drop ? 0.4 + 0.6 * f.a : 1);
  // stones
  if (G.state === 'restoring') {
    const t = Math.min(1, G.restore.t), e = t * t * (3 - 2 * t);
    for (const snap of G.snapshot) {
      const from = G.restore.from.get(snap.id) || snap;
      drawStone(from.x + (snap.x - from.x) * e, from.y + (snap.y - from.y) * e, snap.team);
    }
    const shot = G.stones.find(x => x.id === G.shotId);
    if (shot) drawStone(shot.x, shot.y, shot.team, 1 - e);
  } else {
    for (const st of G.stones) if (st.live) drawStone(st.x, st.y, st.team);
  }
  // pending stone at launch
  if (['aim', 'ai', 'ai-pull'].includes(G.state)) {
    if (G.state === 'aim' && !G.drag) {
      const pulse = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.5 : (Math.sin(time / 300) + 1) / 2;
      ctx.strokeStyle = `rgba(217,165,76,${0.35 + pulse * 0.45})`; ctx.lineWidth = 2;
      circle(X(LAUNCH.x), Y(LAUNCH.y), (SR + 2.5 + pulse * 1.5) * s); ctx.stroke();
    }
    const lx = X(LAUNCH.x), ly = Y(LAUNCH.y);
    if (G.drag) {
      const sh = dragShot(G.drag), k = sh.len > g.maxPx ? g.maxPx / sh.len : 1;
      const st = G.drag.start, cu = G.drag.cur;
      // where the finger went down, and a faint line to the finger
      ctx.save(); ctx.strokeStyle = 'rgba(239,226,200,.45)'; ctx.lineWidth = 1.5;
      circle(st.x, st.y, 10); ctx.stroke();
      ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(st.x, st.y); ctx.lineTo(cu.x, cu.y); ctx.stroke(); ctx.restore();
      if (sh.pw < CANCEL_PW) {
        ctx.save(); ctx.font = '13px "Gowun Dodum", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(32,20,11,.85)'; ctx.strokeText('뒤로 당기세요 · 여기서 놓으면 취소', st.x, st.y - 24);
        ctx.fillStyle = '#efe2c8'; ctx.fillText('뒤로 당기세요 · 여기서 놓으면 취소', st.x, st.y - 24); ctx.restore();
      } else {
        drawAim(sh.ang, sh.pw, { x: lx + sh.ux * k, y: ly + sh.uy * k });
      }
    } else if (G.state === 'ai-pull') {
      const a = G.aiPull, pw = a.pw * Math.min(1, a.t);
      drawAim(a.ang, pw, { x: lx - Math.sin(a.ang) * pw * g.maxPx, y: ly + Math.cos(a.ang) * pw * g.maxPx });
    }
    drawStone(LAUNCH.x, LAUNCH.y, G.cur);
    const note = G.state === 'aim' && G.hint && !G.drag ? (opts.lanes && !G.inLSD ? '알을 옆으로 끌면 라인 변경 · 당겨서 발사' : '화면 아무 곳이나 누르고 뒤로 당겼다 놓으세요') : G.state === 'ai' ? `${nameOf(G.cur)} 생각 중…` : G.state === 'ai-pull' && G.aiPull.label ? `${nameOf(G.cur)} · ${G.aiPull.label}` : '';
    if (note) {
      ctx.save(); ctx.font = '13px "Gowun Dodum", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(32,20,11,.85)'; ctx.strokeText(note, lx, ly - SR * s - 16);
      ctx.fillStyle = '#efe2c8'; ctx.fillText(note, lx, ly - SR * s - 16); ctx.restore();
    }
    // chosen spin, shown on the stone as a ring arrow and a short label
    const sp = G.state === 'ai-pull' ? (G.aiPull.spin || 0) : G.state === 'aim' ? G.spinSel : 0;
    if (opts.spin && sp) {
      const r0 = SR * s + 4;
      ctx.save(); ctx.strokeStyle = '#ffd98a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(lx, ly, r0, sp > 0 ? -2.4 : -0.74, sp > 0 ? -0.74 : -2.4, sp < 0); ctx.stroke();
      ctx.font = '13px "Gowun Dodum", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(32,20,11,.85)'; ctx.strokeText(SPIN_NAME[sp], lx, ly - r0 - 12);
      ctx.fillStyle = '#ffd98a'; ctx.fillText(SPIN_NAME[sp], lx, ly - r0 - 12); ctx.restore();
    }
  }
  // last stone draw: distance from the pin
  if (G.state === 'lsd-show' && G.lsdShow && G.lsdShow.d !== undefined) {
    const m = G.lsdShow, p = clamp(m.t / 0.5, 0, 1), T = G.lsd.target;
    ctx.save(); ctx.strokeStyle = 'rgba(255,214,120,.95)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(X(T.x), Y(T.y)); ctx.lineTo(X(T.x + (m.x - T.x) * p), Y(T.y + (m.y - T.y) * p)); ctx.stroke();
    if (p >= 1) {
      ctx.font = '16px "Do Hyeon", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const tx = X(m.x), ty = Y(m.y) - SR * g.s - 14;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(32,20,11,.85)'; ctx.strokeText(m.d.toFixed(1), tx, ty);
      ctx.fillStyle = '#ffd98a'; ctx.fillText(m.d.toFixed(1), tx, ty);
    }
    ctx.restore();
  }
  // measurement
  if (G.state === 'measure' || G.state === 'endcard') {
    const m = G.measure, t = G.state === 'endcard' ? 99 : m.t;
    let rank = 0;
    m.sc.list.forEach((o, i) => {
      const p = clamp((t - 0.35 - i * 0.3) / 0.25, 0, 1);
      if (p <= 0) return;
      const scorer = m.sc.ids.includes(o.s.id);
      ctx.strokeStyle = scorer ? 'rgba(255,214,120,.95)' : 'rgba(40,24,12,.55)';
      ctx.lineWidth = scorer ? 2.5 : 1.5;
      ctx.beginPath(); ctx.moveTo(X(TEE.x), Y(TEE.y));
      ctx.lineTo(X(TEE.x + (o.s.x - TEE.x) * p), Y(TEE.y + (o.s.y - TEE.y) * p)); ctx.stroke();
      if (p >= 1 && scorer) {
        rank++;
        ctx.strokeStyle = 'rgba(255,214,120,.95)'; ctx.lineWidth = 3; circle(X(o.s.x), Y(o.s.y), (SR + 1.5) * s); ctx.stroke();
        ctx.fillStyle = '#d9a54c'; circle(X(o.s.x) + SR * s, Y(o.s.y) - SR * s, 8); ctx.fill();
        label(String(rank), X(o.s.x) + SR * s, Y(o.s.y) - SR * s + 0.5, '#2a1b0c', 'center', 11);
      }
    });
    ctx.fillStyle = '#2a1b0c'; circle(X(TEE.x), Y(TEE.y), 2.5); ctx.fill();
  }
  // floating texts
  for (const f of G.floats) {
    ctx.save(); ctx.globalAlpha = 1 - f.t;
    ctx.font = `${16}px "Do Hyeon", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(32,20,11,.8)';
    const fx = clamp(X(f.x), X(10), X(90)), fy = Y(f.y + 8 + f.t * 10);
    ctx.strokeText(f.text, fx, fy); ctx.fillStyle = '#ffd98a'; ctx.fillText(f.text, fx, fy);
    ctx.restore();
  }
  drawMinimap();
}

/* ================= loop ================= */
let last = performance.now(), acc = 0;
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  const dt = rdt * speed();          // game clock (physics, animations); the camera keeps real time
  if (G.state === 'moving') {
    acc += dt;
    while (acc >= DT) { step(G.stones, G.map, liveEv); acc -= DT; }
    if (!anyMoving(G.stones)) { acc = 0; afterShot(); }
  } else acc = 0;
  if (G.state === 'restoring') { G.restore.t += dt / 0.9; if (G.restore.t >= 1) finishRestore(); }
  if (G.state === 'settle') { G.settleT -= dt; if (G.settleT <= 0) { G.shot++; prepareShot(); } }
  if (G.laneTo != null) {
    const d = G.laneTo - LAUNCH.x, stp = 110 * dt;
    if (Math.abs(d) <= stp) { LAUNCH.x = G.laneTo; G.laneTo = null; } else LAUNCH.x += Math.sign(d) * stp;
  }
  if (G.state === 'ai-pull') { G.aiPull.t += dt / 0.6; if (G.aiPull.t >= 1.15) release(G.aiPull.ang, G.aiPull.pw, G.aiPull.spin || 0); }
  if (G.state === 'measure') { G.measure.t += dt; if (G.measure.t >= G.measure.dur) showEndCard(); }
  if (G.state === 'lsd-show') { G.lsdShow.t += dt; if (G.lsdShow.t >= 1.8) lsdNext(); }
  for (const f of G.fades) f.a -= dt / 0.5;
  G.fades = G.fades.filter(f => f.a > 0);
  for (const f of G.floats) f.t += dt / 1.2;
  G.floats = G.floats.filter(f => f.t < 1);
  if (G.state === 'moving' || G.state === 'settle') renderTurn();
  if (g.cw) { updateCam(rdt * Math.sqrt(speed())); draw(now); }
  requestAnimationFrame(frame);
}

/* ================= dev panel ================= */
const sliders = [
  ['slDecel', 'oDecel', 'decel', v => v.toFixed(0)],
  ['slStone', 'oStone', 'eStone', v => v.toFixed(2)],
  ['slWall', 'oWall', 'eWall', v => v.toFixed(2)],
  ['slVmax', 'oVmax', 'vmax', v => v.toFixed(0)]
];
function syncDev() {
  for (const [sl, o, key, fmt] of sliders) { $(sl).value = P[key]; $(o).textContent = fmt(P[key]); }
  $('optAim').checked = opts.aim; $('optFgz').checked = opts.fgz;
  $('optGutter').checked = !!opts.gutter; $('optTicket').checked = !!opts.ticket; $('optLanes').checked = !!opts.lanes;
  $('slTicket').value = opts.ticketCount; $('oTicket').textContent = opts.ticketCount; $('slTicket').disabled = !opts.ticket;
  $('optRails').checked = !!opts.rails; $('optSpin').checked = !!opts.spin;
  $('optBan').checked = !!opts.cushionBan; $('optBan').disabled = !opts.fgz;
  $('optBlank').checked = !!opts.blankSwitch; $('optLsd').checked = !!opts.lsd; $('optPlaced').checked = !!opts.placed; $('optPlacedHouse').checked = !!opts.placedHouse; $('optPlacedHouse').disabled = !opts.placed;
  $('rlLow').checked = opts.railLayout !== 'two'; $('rlTwo').checked = opts.railLayout === 'two';
  $('slLive').value = opts.liveTop; $('oLive').textContent = opts.liveTop;
  $('slLive').disabled = !opts.rails || opts.railLayout === 'two';
  for (const r of document.querySelectorAll('input[name=railLayout]')) r.disabled = !opts.rails;
  $('bPhys').checked = !opts.mirror; $('bMirror').checked = !!opts.mirror;
  {
    const out = Math.atan(Math.tan(Math.PI / 4) / P.eWall) * 180 / Math.PI;
    $('bounceNote').textContent = opts.mirror
      ? `들어온 각도 그대로 튕기고, 속도만 ${Math.round(P.eWall * 100)}%로 줄어듭니다.`
      : `벽 쪽 속도만 줄어 반사가 벽 쪽으로 눕습니다. 45°로 들어오면 ${out.toFixed(1)}°로 나갑니다.`;
  }
  $('slFgz').value = opts.fgzShots; $('oFgz').textContent = opts.fgzShots; $('slFgz').disabled = !opts.fgz;
  const reach = p => (p * P.vmax) ** 2 / (2 * P.decel);
  const toTee = TEE.y - LAUNCH.y, toBack = BACK + SR - LAUNCH.y;
  const full = reach(1), seventy = reach(0.7);
  const okFull = full > toBack, okSev = Math.abs(seventy - toTee) <= 12;
  $('reach').innerHTML =
    `최대 세기 비거리 <b class="${okFull ? 'ok' : 'warn'}">${full.toFixed(0)}</b> (백 라인 통과에 ${toBack.toFixed(0)} 필요)<br>` +
    `70% 세기 비거리 <b class="${okSev ? 'ok' : 'warn'}">${seventy.toFixed(0)}</b> (티까지 ${toTee.toFixed(0)})<br>` +
    `<span>기믹 구역 밖, 직선 기준 계산값</span>`;
  $('devJson').textContent = JSON.stringify({
    units: 'sheet width = 100',
    sheet: { width: W, length: L, launchY: LAUNCH.y, minLineY: HOG, teeY: TEE.y, houseRadius: R, backLineY: BACK, stoneRadius: SR },
    physics: { deceleration: P.decel, stoneRestitution: P.eStone, wallRestitution: P.eWall, wallBounce: opts.mirror ? 'mirror angle, speed x restitution' : 'physical (normal component x restitution)', maxSpeed: P.vmax, maxPullPx: 'clamp(min(screenW, screenH) * 0.3, 90, 150)', fixedStep: '1/180' },
    rules: { ends: ENDS, shotsPerEnd: SHOTS, stonesPerPlayer: PER, freeGuardZone: opts.fgz, freeGuardZoneShots: opts.fgzShots, cushionBannedDuringFreeGuardZone: !!opts.cushionBan, blankEndPassesHammer: !!opts.blankSwitch, firstHammer: opts.lsd ? 'last stone draw' : 'coin toss', bonusGuard: opts.placed ? { at: PLACE_GUARD, houseStoneForHammer: opts.placedHouse ? PLACE_HOUSE : false } : false, aimLine: opts.aim,
      openSides: opts.gutter ? { fromY: GAP_Y0, toY: GAP_Y1 } : false, cushionTicketsPerEnd: opts.ticket ? opts.ticketCount : null, launchLanes: opts.lanes ? LANES : [50],
      railWindows: opts.rails ? { layout: opts.railLayout, livelyY: railWindows(), deadRestitution: DEAD_E, deadSlideKeep: DEAD_SLIDE } : false,
      spin: opts.spin ? { choices: ['short', 'none', 'long'], slideFactor: SPIN_K, spentOnFirstRail: true } : false }
  }, null, 2);
  $('soundBtn').textContent = opts.sound ? '소리 켬' : '소리 끔';
}
for (const [sl, , key] of sliders) $(sl).addEventListener('input', e => { P[key] = parseFloat(e.target.value); saveDev(); syncDev(); });
$('optAim').addEventListener('change', e => { opts.aim = e.target.checked; saveDev(); syncDev(); });
$('optFgz').addEventListener('change', e => { opts.fgz = e.target.checked; saveDev(); syncDev(); renderHud(); });
$('optGutter').addEventListener('change', e => {
  opts.gutter = e.target.checked; saveDev(); syncDev();
  G.map = buildField(MAPS[G.state === 'menu' ? 'base' : G.mapKey]);
});
$('optTicket').addEventListener('change', e => { opts.ticket = e.target.checked; saveDev(); syncDev(); renderHud(); });
$('slTicket').addEventListener('input', e => { opts.ticketCount = parseInt(e.target.value, 10); saveDev(); syncDev(); renderHud(); });
$('optLanes').addEventListener('change', e => { opts.lanes = e.target.checked; if (!opts.lanes) { LAUNCH.x = 50; G.laneTo = null; } saveDev(); syncDev(); });
for (const r of document.querySelectorAll('input[name=bounce]')) r.addEventListener('change', e => { opts.mirror = e.target.value === 'mirror'; saveDev(); syncDev(); });
$('slFgz').addEventListener('input', e => { opts.fgzShots = parseInt(e.target.value, 10); saveDev(); syncDev(); renderHud(); });
const rebuildField = () => { G.map = buildField(MAPS[G.state === 'menu' ? 'base' : G.mapKey]); };
$('optBan').addEventListener('change', e => { opts.cushionBan = e.target.checked; saveDev(); syncDev(); renderHud(); });
$('optBlank').addEventListener('change', e => { opts.blankSwitch = e.target.checked; saveDev(); syncDev(); });
$('optLsd').addEventListener('change', e => { opts.lsd = e.target.checked; saveDev(); syncDev(); });
$('optPlaced').addEventListener('change', e => { opts.placed = e.target.checked; saveDev(); syncDev(); });
$('optPlacedHouse').addEventListener('change', e => { opts.placedHouse = e.target.checked; saveDev(); syncDev(); });
for (const r of document.querySelectorAll('input[name=railLayout]')) r.addEventListener('change', e => { opts.railLayout = e.target.value; saveDev(); syncDev(); rebuildField(); });
$('slLive').addEventListener('input', e => { opts.liveTop = parseInt(e.target.value, 10); saveDev(); syncDev(); rebuildField(); });
$('optRails').addEventListener('change', e => {
  opts.rails = e.target.checked; saveDev(); syncDev();
  G.map = buildField(MAPS[G.state === 'menu' ? 'base' : G.mapKey]);
});
$('optSpin').addEventListener('change', e => { opts.spin = e.target.checked; G.spinSel = 0; saveDev(); syncDev(); renderHud(); });
$('devReset').addEventListener('click', () => { Object.assign(P, DEFAULTS); saveDev(); syncDev(); });
$('devBtn').addEventListener('click', () => { $('dev').hidden = false; $('devClose').focus(); });
$('devClose').addEventListener('click', () => { $('dev').hidden = true; $('devBtn').focus(); });
$('devCopy').addEventListener('click', () => {
  const text = $('devJson').textContent;
  const sel = () => { const r = document.createRange(); r.selectNodeContents($('devJson')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try {
    navigator.clipboard.writeText(text).then(() => { $('devCopy').textContent = '복사됨'; setTimeout(() => { $('devCopy').textContent = '값 복사'; }, 1500); }, sel);
  } catch (e) { sel(); }
});
$('soundBtn').addEventListener('click', () => { opts.sound = !opts.sound; saveDev(); syncDev(); if (opts.sound) audio(); });
$('menuBtn').addEventListener('click', () => { closePopovers(); toMenu(); });
function closePopovers() {
  $('scorePanel').hidden = true; $('scorePill').setAttribute('aria-expanded', 'false');
  $('more').hidden = true; $('moreBtn').setAttribute('aria-expanded', 'false');
}
$('scorePill').addEventListener('click', () => {
  const open = $('scorePanel').hidden;
  closePopovers(); $('scorePanel').hidden = !open; $('scorePill').setAttribute('aria-expanded', String(open));
});
$('moreBtn').addEventListener('click', () => {
  const open = $('more').hidden;
  closePopovers(); $('more').hidden = !open; $('moreBtn').setAttribute('aria-expanded', String(open));
});
$('devBtn').addEventListener('click', closePopovers);
for (const b of $('spinBar').querySelectorAll('button')) b.addEventListener('click', () => { G.spinSel = Number(b.dataset.spin); updateSpinBar(); });
cv.addEventListener('pointerdown', closePopovers);
$('startBtn').addEventListener('click', () => { audio(); startMatch(readMenu()); });
for (const r of document.querySelectorAll('input[name=mode]')) r.addEventListener('change', () => { $('watchLv').hidden = !$('m-watch').checked; });
$('speedBtn').addEventListener('click', () => {
  G.speed = { 1: 2, 2: 4, 4: 1 }[G.speed || 1];
  $('speedBtn').textContent = `${G.speed}배속`;
});

/* ================= boot ================= */
syncDev();
resize();
toMenu();
requestAnimationFrame(t => { last = t; frame(t); });
})();
